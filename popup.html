<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>YTPlus<span>+</span></h1>
  <div id="state">Checking page…</div>
  <label class="row"><input type="checkbox" id="enabled"><span>Master switch</span></label>
  <hr>
  <label class="row"><input type="checkbox" id="ads"><span>Block ads</span></label>
  <label class="row"><input type="checkbox" id="qualityLock"><span>Maximum quality</span></label>
  <label class="row"><input type="checkbox" id="autoSpeed"><span>Smart speed</span></label>
  <label class="row"><input type="checkbox" id="sponsorblock"><span>Skip sponsors</span></label>
  <label class="row"><input type="checkbox" id="nsfwVideo"><span>NSFW detection</span></label>
  <label class="row"><input type="checkbox" id="musicBlur"><span>Blur music videos</span></label>
  <label class="row"><input type="checkbox" id="audio"><span>Equalizer engine</span></label>
  <label class="row"><input type="checkbox" id="gifComments"><span>GIF comments</span></label>
  <label class="row"><input type="checkbox" id="cleanUi"><span>Clean interface</span></label>
  <hr>
  <button id="options">Advanced settings</button>
  <script src="popup.js"></script>
</body>
</html>
